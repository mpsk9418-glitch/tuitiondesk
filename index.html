<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TuitionDesk Parent</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--navy:#0f1b3d;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--bg:#f3f5fa;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#eef0f4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0b0f1a;color:var(--ink);display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:420px;height:100vh;max-height:880px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;margin:auto;border-radius:18px}
header{background:var(--navy);color:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font-size:18px}
header p{font-size:12px;opacity:.7;margin-top:2px}
.ghost{background:transparent;color:#fff;border:1px solid #fff;border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:14px}
nav{display:flex;background:#fff;border-top:1px solid #e5e7eb}
nav button{flex:1;padding:9px 0 11px;border:0;background:none;font-size:11px;color:var(--muted);cursor:pointer}
nav button.on{color:var(--blue);font-weight:700}
nav i{font-style:normal;font-size:16px;display:block}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.big{font-size:26px;font-weight:800}
.lbl{font-size:12px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:17px}
.stat span{font-size:11px;color:var(--muted)}
.av{width:60px;height:60px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;margin:0 auto}
.btn{border:0;border-radius:10px;padding:13px;font-weight:700;font-size:14px;cursor:pointer;color:#fff;background:var(--blue);width:100%}
.btn:disabled{background:#d1d5db;color:#6b7280}
.tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;display:inline-block}
.late{background:#fee2e2;color:var(--red)}
.ok{background:#dcfce7;color:#15803d}
.due{background:#e0e7ff;color:#3730a3}
input[type=text]{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;margin-top:6px;text-transform:uppercase}
.hw{display:flex;gap:10px;align-items:center;padding:10px 0;font-size:14px;border-bottom:1px solid var(--line)}
.hw:last-child{border-bottom:0}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;margin:14px 0 24px}
.bars div{flex:1;background:linear-gradient(var(--blue),#60a5fa);border-radius:6px 6px 0 0;position:relative;min-height:6px}
.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.bars em{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;font-style:normal;font-weight:700}
.stamp{display:inline-block;background:#facc15;color:#111;font-weight:900;font-size:20px;padding:6px 16px;border-radius:10px;transform:rotate(-5deg)}
.err{color:var(--red);font-size:13px;margin-top:8px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header><div><h1 id="ttl">TuitionDesk</h1><p id="sub">Parent app</p></div><button id="out" class="ghost" onclick="logout()" style="display:none">Log out</button></header>
  <main id="mn"></main>
  <nav id="nv"></nav>
</div>
<div id="toast"></div>
<script>
const TODAY=new Date(2026,9,22);
const UPI_ID='9647315506@fam';
const PAYEE='TuitionDesk';
const COL=['#6366f1','#f97316','#14b8a6','#ec4899','#8b5cf6','#0ea5e9','#84cc16','#f59e0b'];

// Same students as TuitionDesk. code = login code the teacher gives to the parent.
let S=[
 {code:'AARAV01',id:1,name:'Aarav Sharma',cls:'Class 10',subj:'Maths',batch:'A',fee:3500,due:'2026-10-10',paid:false,att:[1,1,1,0,1,1,1,1],tests:[62,70,68,74,71,78],hw:['Ex 4.2 · Q1–10','Ex 4.3 · Q1–6'],hwDone:[true,false]},
 {code:'DIYA02',id:2,name:'Diya Kapoor',cls:'Class 9',subj:'Science',batch:'A',fee:3000,due:'2026-10-13',paid:false,att:[1,1,0,1,1,1,1,1],tests:[66,64,70,72,75,73],hw:['Chapter 6 · Q1–5'],hwDone:[true]},
 {code:'ROHAN03',id:3,name:'Rohan Verma',cls:'Class 12',subj:'Physics',batch:'B',fee:4500,due:'2026-10-17',paid:false,att:[1,1,1,1,1,0,1,1],tests:[58,61,64,66,69,72],hw:['Ch 12 · Numericals'],hwDone:[false]},
 {code:'MEERA04',id:4,name:'Meera Patel',cls:'Class 10',subj:'Maths + Science',batch:'B',fee:3500,due:'2026-10-17',paid:false,att:[1,0,1,1,1,1,0,1],tests:[55,60,62,65,67,70],hw:['Ex 3.1 · Q1–8','Lab report'],hwDone:[true,true]},
 {code:'KABIR05',id:5,name:'Kabir Joshi',cls:'Class 11',subj:'Chemistry',batch:'A',fee:3500,due:'2026-10-05',paid:true,att:[1,1,1,1,1,1,1,1],tests:[81,79,84,86,88,90],hw:['Mole concept worksheet'],hwDone:[true]},
 {code:'SARA06',id:6,name:'Sara Noor',cls:'Class 9',subj:'Maths',batch:'B',fee:3000,due:'2026-10-15',paid:false,att:[1,0,1,1,0,1,1,1],tests:[48,52,50,55,57,59],hw:['Ex 2.2 · Q1–6'],hwDone:[false]},
 {code:'ISHAAN07',id:7,name:'Ishaan Rao',cls:'Class 12',subj:'Chemistry',batch:'B',fee:3000,due:'2026-10-20',paid:true,att:[1,1,1,0,1,1,1,1],tests:[70,72,74,76,77,79],hw:['Organic reactions'],hwDone:[true]},
 {code:'TANYA08',id:8,name:'Tanya Mehta',cls:'Class 10',subj:'Science',batch:'A',fee:3500,due:'2026-10-25',paid:false,att:[1,1,1,1,1,1,1,1],tests:[85,88,86,90,92,94],hw:['Light · Ch 10 Q1–8'],hwDone:[true]}
];

let me=null, tab='home', toastT;
const $=id=>document.getElementById(id);
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');
const ini=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const col=s=>COL[(s.id-1)%COL.length];
const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const pres=s=>s.att.filter(x=>x).length;
const pct=s=>Math.round(pres(s)/s.att.length*100);
const late=s=>s.paid?0:Math.max(0,Math.floor((TODAY-new Date(s.due+'T00:00:00'))/86400000));
const latest=s=>s.tests[s.tests.length-1];
const absentDays=s=>s.att.map((v,i)=>v?null:i).filter(x=>x!==null).map(i=>{const n=s.att.length-1-i;return n===0?'Today':n+' days ago ('+new Date(2026,9,22-n).toLocaleDateString('en-IN',{day:'numeric',month:'short'})+')'}).reverse();
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
function go(k){tab=k;render()}
function login(){
  const n=($('sname').value||'').trim().toLowerCase();
  const c=$('scls').value;
  if(!n){$('err').textContent='Student ka naam likhein.';return}
  const hits=S.filter(s=>s.cls===c && (s.name.toLowerCase()===n || s.name.toLowerCase().split(' ')[0]===n));
  if(hits.length===0){$('err').textContent='Ye student nahi mila. Naam aur class check karein.';return}
  if(hits.length>1){$('err').textContent='Is class mein ek se zyada student mile. Poora naam likhein.';return}
  me=hits[0]; tab='home'; render();
}

function logout(){me=null;render()}
function pay(){me.claimed=true;toast('Sent to the teacher for verification');render()}
function upiLink(s){return 'upi://pay?pa='+encodeURIComponent(UPI_ID)+'&pn='+encodeURIComponent(PAYEE)+'&am='+s.fee+'&cu=INR&tn='+encodeURIComponent('Fee '+s.name)}
function drawQR(){
  const el=document.getElementById('qr'); if(!el||typeof qrcode!=='function'||!me) return;
  const q=qrcode(0,'M'); q.addData(upiLink(me)); q.make();
  el.innerHTML=q.createImgTag(5,8);
}
function hwToggle(i){me.hwDone[i]=!me.hwDone[i]}
const TABS=[['home','🏠','Home'],['att','📅','Attendance'],['hw','📝','Homework'],['tests','📊','Tests']];
function nav(){
  $('nv').style.display=me?'flex':'none';
  $('nv').innerHTML=TABS.map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('');
  $('out').style.display=me?'inline-block':'none';
}

const CLASSES=[...new Set(S.map(s=>s.cls))];
function loginView(){
  return `
  <div class="card" style="margin-top:20px">
    <div class="big" style="font-size:20px;text-align:center">Parent login</div>
    <div class="lbl" style="margin-top:6px;text-align:center">Child ka naam aur class bharein</div>
    <label class="lbl" style="display:block;margin-top:14px">Student name</label>
    <input type="text" id="sname" placeholder="e.g. Aarav Sharma" style="text-transform:none" onkeydown="if(event.key==='Enter')login()">
    <label class="lbl" style="display:block;margin-top:12px">Class</label>
    <select id="scls" style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;margin-top:6px;background:#fff">${CLASSES.map(c=>`<option>${c}</option>`).join('')}</select>
    <button class="btn" style="margin-top:14px" onclick="login()">View my child's details</button>
    <div id="err" class="err"></div>
  </div>`;
}

function homeView(){
  const s=me, l=late(s);
  return `
  <div class="card" style="text-align:center">
    <div class="av" style="background:${col(s)}">${ini(s.name)}</div>
    <b style="display:block;margin-top:8px;font-size:17px">${s.name}</b>
    <div class="lbl">${s.cls} · ${s.subj} · Batch ${s.batch}</div>
  </div>
  <div class="grid3">
    <div class="stat"><b>${pct(s)}%</b><span>attendance</span></div>
    <div class="stat"><b>${latest(s)}%</b><span>last test</span></div>
    <div class="stat"><b>${pres(s)}/${s.att.length}</b><span>days present</span></div>
  </div>
  <div class="card" style="margin-top:12px">
    <b>Absent days</b>
    ${absentDays(s).length?absentDays(s).map(d=>`<div class="hw"><span>${d}</span><span class="tag late">Absent</span></div>`).join(''):'<div class="hw">No absences ✓</div>'}
  </div>
  <div class="card" style="text-align:center">
    ${s.paid
      ?`<div class="stamp">PAID ✓</div><div class="big" style="margin-top:8px">${inr(s.fee)}</div><div class="lbl">Receipt sent on WhatsApp</div>`
      :`<div class="lbl">Fee due · ${fmt(s.due)}</div>
        <div class="big" style="color:var(--red)">${inr(s.fee)}</div>
        <div class="lbl" style="color:var(--red)">${l?l+' days late':'Not due yet'}</div>
        <div id="qr" style="margin:12px auto;background:#fff;padding:10px;border-radius:12px;width:fit-content"></div>
        <div class="lbl">Scan with any UPI app · ${inr(s.fee)}</div>
        ${s.claimed?'<div class="tag due" style="margin-top:10px">Waiting for the teacher to verify</div>':'<button class="btn" style="margin-top:12px" onclick="pay()">I have paid</button>'}`}
  </div>`;
}

// Records cover 15–22 Oct (the last 8 days). s.att[0] = 15 Oct ... s.att[7] = 22 Oct.
const TODAY_DAY=22;
function dayStatus(s,d){const i=d-15; if(i<0||i>=s.att.length) return null; return s.att[i]?'P':'A'}
function attView(){
  const s=me, year=2026, month=9;
  const firstWeekday=new Date(year,month,1).getDay();
  const days=new Date(year,month+1,0).getDate();
  let cells='';
  for(let i=0;i<firstWeekday;i++) cells+='<div></div>';
  let P=0, A=0;
  for(let d=1;d<=days;d++){
    const st=dayStatus(s,d);
    if(st==='P')P++; if(st==='A')A++;
    const bg=st==='P'?'#16a34a':st==='A'?'#dc2626':'#fff';
    const color=st?'#fff':'#111';
    const ring=d===TODAY_DAY?'box-shadow:inset 0 0 0 2px #1e3a8a;':'';
    cells+=`<div style="background:${bg};color:${color};${ring}aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:1px solid #e5e7eb">${d}</div>`;
  }
  const pct=(P+A)?(P/(P+A)*100).toFixed(2):'0.00';
  const legend=(c,t)=>`<div style="display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0"><span style="width:22px;height:18px;background:${c};border-radius:3px;display:inline-block"></span>${t}</div>`;
  return `
  <div class="card">
    <div class="lbl" style="text-align:center;font-weight:700;color:var(--ink)">October 2026</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--muted);margin:10px 0 4px">${['SUN','MON','TUE','WED','THU','FRI','SAT'].map(x=>`<div>${x}</div>`).join('')}</div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:0">${cells}</div>
  </div>
  <div class="card">
    <div class="lbl" style="text-align:center;font-weight:700;color:var(--ink);margin-bottom:6px">Attendance for this month</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px">
      <div>${legend('#16a34a','Present : '+P)}</div>
      <div>${legend('#dc2626','Absent : '+A)}</div>
      <div>${legend('#f97316','Half Days : 0')}</div>
      <div>${legend('#16a34a','OT : 0 hrs - 0 days')}</div>
    </div>
    <div style="font-weight:800;font-size:16px;margin-top:8px">Percentage : ${pct}%</div>
    <div class="lbl" style="margin-top:6px">Records: 15–22 Oct only.</div>
  </div>`;
}
function hwView(){
  const s=me, done=s.hwDone.filter(Boolean).length;
  return `
  <div class="card">
    <div class="lbl">Homework · ${done} of ${s.hw.length} done</div>
    ${s.hw.map((h,i)=>`<label class="hw"><input type="checkbox" ${s.hwDone[i]?'checked':''} onchange="hwToggle(${i})"> ${h}</label>`).join('')}
  </div>`;
}

function testsView(){
  const s=me, last6=s.tests.slice(-6), start=s.tests.length-last6.length;
  return `
  <div class="card">
    <div class="lbl">Latest test</div>
    <div class="big">${latest(s)}%</div>
    <div class="lbl">Last ${last6.length} tests</div>
    <div class="bars">${last6.map((v,i)=>`<div style="height:${v}%"><em>${v}</em><span>T${start+i+1}</span></div>`).join('')}</div>
  </div>`;
}

function render(){
  nav();
  if(!me){
    $('ttl').textContent='TuitionDesk'; $('sub').textContent='Parent app';
    $('mn').innerHTML=loginView();
    return;
  }
  const T={home:['Hi, parent of '+me.name.split(' ')[0],'Attendance, fees and tests',homeView],
           hw:['Homework','Tick off what is done',hwView],
           tests:['Tests','Last 6 test scores',testsView],
           att:['Attendance','This month',attView]};
  const [t,s,fn]=T[tab];
  $('ttl').textContent=t; $('sub').textContent=s;
  $('mn').innerHTML=fn();
  $('mn').scrollTop=0;
  drawQR();
}
render();
</script>
<script>
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
</script>
</body>
</html>
